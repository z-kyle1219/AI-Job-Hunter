<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Job Hunter · 高保真关键帧</title>
<style>
  /* ============================================================
     设计令牌 · Design Tokens
     颜色按方案定义在 .page.a / .page.b，组件只引用语义名 --fg-* / --bg / --brand
     这里放与方案无关的：版式节奏、圆角、动效、字号
     ============================================================ */
  :root{
    /* 版式节奏：顶栏高度 = 主视觉上留白；标题 → 卡片 62 */
    --rail-h:106px;
    --hero-gap:62px;
    --card-w:312px;
    --card-h:322px;
    --card-gap:26px;

    /* 圆角：A 克制（2 / 3），B 圆润（10 / 16 / 18） */
    --r-a-sm:2px;
    --r-a-md:3px;
    --r-b-sm:10px;
    --r-b-md:16px;
    --r-b-lg:18px;

    /* 动效 */
    --dur-base:.3s;
    --dur-slow:.35s;
    --ease-out:cubic-bezier(.2,.7,.3,1);

    /* 字号：沿用现有档位，只给高频的几个命名 */
    --fs-hero-a:61px;
    --fs-hero-b:58px;
    --fs-h2:23px;
    --fs-h3:20px;
    --fs-body:12.5px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#0d0e10;color:#ececea;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 预览外壳 ---------- */
  .topbar-ui{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:13px 26px;background:#0d0e10;border-bottom:1px solid #212327;
  }
  .tb-title{font:600 11px/1 "Segoe UI";letter-spacing:.22em;text-transform:uppercase;color:#f2f2ef}
  .tb-sub{font:400 11px/1 "Segoe UI";letter-spacing:.06em;color:#787e86}   /* 原 #6d7178，3.9:1 → 4.7:1 */
  .tb-tabs{display:flex;gap:5px;margin-left:auto}
  .tb-tabs button{
    appearance:none;border:1px solid #2a2d31;background:#15171a;color:#9aa0a7;
    font:500 11px/1 "Segoe UI";letter-spacing:.1em;padding:8px 12px;border-radius:4px;cursor:pointer;
  }
  .tb-tabs button:hover{color:#fff;border-color:#3d4248}
  .tb-tabs button.on{background:#f2f2ef;color:#111;border-color:#f2f2ef}

  #stage{--s:1;display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 0 64px}
  .shotwrap{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .frame{width:1440px;height:900px;zoom:var(--s);box-shadow:0 30px 80px -40px rgba(0,0,0,.9)}
  .cap{font:400 11px/1.5 "Segoe UI";letter-spacing:.1em;color:#7b8189}
  .cap b{color:#e8e8e4;font-weight:600;letter-spacing:.16em}

  body.shot{background:#fff}
  body.shot .topbar-ui{display:none}
  body.shot #stage{padding:0;gap:0}
  body.shot .cap{display:none}
  body.shot .frame{box-shadow:none}

  /* ---------- 页面骨架 ---------- */
  .page{
    position:relative;width:1440px;height:900px;overflow:hidden;
    display:flex;flex-direction:column;padding:32px 64px 28px;

    /* 语义别名：组件只认这六个名字，新增方案时不用改任何组件规则 */
    --fg-1:var(--ink);
    --fg-2:var(--ink-2);
    --fg-3:var(--ink-3);
    --bg:var(--paper);
    --hairline:var(--line);
    --brand:var(--accent);
  }
  .page > *{position:relative;z-index:2}

  /* ================= A 方案：黑白灰 · 点阵 ================= */
  .page.a{
    --ink:#121212; --ink-2:#5d5952; --ink-3:#726d63;   /* ink-3 原 #98938a，对比度 2.8:1 → 4.7:1 */
    --paper:#f6f5f1; --line:#e4e1d8; --accent:#121212;
    background:var(--bg);
  }
  .page.a::before{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px,#d5d1c6 1px,transparent 1.7px);
    background-size:22px 22px;
    -webkit-mask-image:radial-gradient(118% 92% at 50% 40%,#000 14%,transparent 74%);
    mask-image:radial-gradient(118% 92% at 50% 40%,#000 14%,transparent 74%);
  }

  /* ================= B 方案：黑白蓝 · 路径 ================= */
  .page.b{
    --ink:#0e1116; --ink-2:#5b6273; --ink-3:#6e7587;   /* ink-3 原 #8e95a6，对比度 3.0:1 → 4.6:1 */
    --paper:#ffffff; --line:#e6e8f0; --accent:#2743f0;
    background:#fff;
  }
  .page.b .bgpaths{position:absolute;inset:0;z-index:1;pointer-events:none}
  .page.b::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(46% 40% at 82% 6%,rgba(39,67,240,.075),transparent 70%),
               radial-gradient(40% 38% at 8% 92%,rgba(39,67,240,.05),transparent 72%);
  }

  /* ---------- 顶部栏杆 ---------- */
  .rail{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;min-height:var(--rail-h)}
  .mark{display:flex;align-items:center;gap:9px;color:var(--fg-1);padding-top:6px}
  .mark i{display:block;width:9px;height:9px;background:var(--brand);border-radius:0}
  .page.b .mark i{border-radius:2px}
  .mark span{font:600 10px/1 "Segoe UI";letter-spacing:.28em;text-transform:uppercase}

  .upload{
    justify-self:center;display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:2px 12px 8px;color:var(--fg-3);cursor:pointer;position:relative;
  }
  .upload .arw{display:block;color:var(--fg-1);opacity:.72;transition:transform var(--dur-base) ease,opacity var(--dur-base) ease}
  .upload:hover .arw{transform:translateY(-3px);opacity:1}
  .upload .lbl{font-size:12px;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap}
  .upload.done .lbl{display:none}
  .upload .tip{
    position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:var(--fg-1);color:var(--bg);font-size:11px;letter-spacing:.1em;
    padding:7px 11px;white-space:nowrap;border-radius:2px;
  }
  .page.b .upload .tip{border-radius:8px;background:var(--brand);color:#fff}

  .avatar{
    justify-self:end;width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;
    border:1px solid var(--hairline);background:#fff;color:var(--fg-3);
  }
  .page.a .avatar{border-radius:50%}
  .avatar:hover{transform:translateY(-2px)}
  .avatar.logged{background:var(--fg-1);border-color:var(--fg-1);color:#f7f6f2}
  .page.b .avatar.logged{background:var(--brand);border-color:var(--brand);color:#fff}
  .avatar .ini{font:600 12px/1 "Segoe UI";letter-spacing:.16em;text-transform:uppercase}

  /* ---------- 主视觉 ---------- */
  .hero{margin-top:var(--rail-h);text-align:center}
  .hero h1{margin:0;font-weight:400;color:var(--fg-1)}
  .page.a .hero h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:var(--fs-hero-a);letter-spacing:-.018em;line-height:1.12;
  }
  .page.b .hero h1{
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:var(--fs-hero-b);font-weight:600;letter-spacing:-.032em;line-height:1.1;
  }
  .page.b .hero h1 em{font-style:normal;color:var(--brand)}
  .hero .tag{margin:20px 0 0;color:var(--fg-3);text-transform:uppercase}
  .page.a .hero .tag{font:400 10.5px/1 "Segoe UI";letter-spacing:.44em}
  .page.b .hero .tag{font:400 10.5px/1 "Segoe UI";letter-spacing:.34em}

  /* ---------- 三张卡片 ---------- */
  .cards{margin-top:var(--hero-gap);display:flex;justify-content:center;gap:var(--card-gap)}
  .card{
    position:relative;width:var(--card-w);height:var(--card-h);padding:24px 26px 22px;
    display:flex;flex-direction:column;cursor:pointer;
    transition:transform var(--dur-slow) var(--ease-out),box-shadow var(--dur-slow) ease,
               border-color var(--dur-slow) ease,background var(--dur-slow) ease;
  }
  .page.a .card{
    background:rgba(255,255,255,.62);border:1px solid var(--hairline);border-radius:var(--r-a-md);
  }
  .page.a .card:hover,.page.a .card.is-hover{
    background:#fff;border-color:#171717;transform:translateY(-5px);
    box-shadow:0 22px 44px -32px rgba(18,18,18,.55);
  }
  .page.b .card{
    background:#fff;border:1px solid var(--hairline);border-radius:var(--r-b-md);
    box-shadow:0 1px 2px rgba(16,24,64,.05);
  }
  .page.b .card::before{
    content:"";position:absolute;left:0;top:-1px;height:3px;width:0;border-radius:16px 16px 0 0;
    background:var(--brand);transition:width .4s cubic-bezier(.2,.7,.3,1);
  }
  .page.b .card:hover::before,.page.b .card.is-hover::before{width:100%}
  .page.b .card:hover,.page.b .card.is-hover{
    transform:translateY(-11px);border-color:#c9d2ff;
    box-shadow:0 34px 60px -30px rgba(23,40,110,.34);
  }

  .c-top{display:flex;align-items:baseline;justify-content:space-between}
  .c-top .num{font:500 10px/1 "Consolas","Segoe UI",monospace;letter-spacing:.18em;color:var(--fg-3)}
  .c-top .en{font:600 9.5px/1 "Segoe UI";letter-spacing:.26em;text-transform:uppercase;color:var(--fg-3)}
  .page.b .c-top .num{color:var(--brand);opacity:.85}

  .scene{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0 4px}
  .scene svg{width:100%;height:auto;max-height:118px;overflow:visible}

  .card h3{margin:0;color:var(--fg-1)}
  .page.a .card h3{font-size:var(--fs-h3);font-weight:600;letter-spacing:.2em}
  .page.b .card h3{font-size:var(--fs-h3);font-weight:600;letter-spacing:.14em}
  .card p{margin:9px 0 0;font-size:var(--fs-body);line-height:1.78;color:var(--fg-2);letter-spacing:.02em}
  .card .go{
    margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:8px;
    font:600 9.5px/1 "Segoe UI";letter-spacing:.24em;text-transform:uppercase;color:var(--fg-3);
    transition:color var(--dur-base) ease;
  }
  .card .go svg{transition:transform var(--dur-base) ease}
  .card:hover .go,.card.is-hover .go{color:var(--fg-1)}
  .page.b .card:hover .go,.page.b .card.is-hover .go{color:var(--brand)}
  .card:hover .go svg,.card.is-hover .go svg{transform:translateX(5px)}

  /* ---------- 页脚 ---------- */
  .foot{
    margin-top:auto;display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid var(--hairline);padding-top:15px;
    font:400 10px/1 "Segoe UI";letter-spacing:.2em;text-transform:uppercase;color:var(--fg-3);
  }
  .foot .dot{opacity:.5}

  /* ---------- 弹窗 ---------- */
  .scrim{
    position:absolute;inset:0;z-index:20;display:grid;place-items:center;
    background:rgba(14,13,11,.36);backdrop-filter:blur(3px) saturate(.9);
  }
  .modal{position:relative;width:432px;background:#fff;padding:34px 36px 28px;color:#141414}
  .page.a .modal{border-radius:var(--r-a-md);border:1px solid #e4e1d8;box-shadow:0 40px 90px -40px rgba(10,10,10,.7)}
  .page.b .modal{border-radius:var(--r-b-lg);border:1px solid #e6e8f0;box-shadow:0 44px 90px -44px rgba(16,24,64,.55)}
  .modal .eyebrow{font:600 9.5px/1 "Segoe UI";letter-spacing:.3em;text-transform:uppercase;color:#726d63}   /* 原 #a09b92，2.8:1 → 5.0:1 */
  .page.b .modal .eyebrow{color:var(--brand);opacity:.9}
  .modal h2{margin:12px 0 0;font-size:var(--fs-h2);font-weight:600;letter-spacing:.04em}
  .modal .sub{margin:8px 0 0;font-size:var(--fs-body);line-height:1.6;color:#6f6a62;letter-spacing:.02em}
  .modal .x{
    position:absolute;right:18px;top:18px;width:28px;height:28px;display:grid;place-items:center;
    border:0;background:transparent;color:#a09b92;cursor:pointer;
  }
  .modal .tabs{display:flex;gap:26px;margin-top:26px;border-bottom:1px solid #ece9e2}
  .modal .tabs span{
    padding-bottom:11px;font-size:13px;letter-spacing:.12em;color:#a09b92;position:relative;cursor:pointer;
  }
  .modal .tabs span.on{color:#141414}
  .modal .tabs span.on::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:#141414;
  }
  .page.b .modal .tabs span.on{color:var(--brand)}
  .page.b .modal .tabs span.on::after{background:var(--brand)}
  .modal label{display:block;margin-top:22px;font-size:10.5px;letter-spacing:.16em;color:var(--fg-3);text-transform:uppercase}
  .modal .field{
    margin-top:9px;height:44px;border:1px solid #e4e1d8;display:flex;align-items:center;
    padding:0 14px;gap:10px;background:#fcfbf8;
  }
  .page.a .modal .field{border-radius:var(--r-a-sm)}
  .page.b .modal .field{border-radius:var(--r-b-sm);border-color:#e2e5ee;background:#fbfcff}
  .modal .field .ph{font-size:13px;color:#b3aea4;letter-spacing:.04em}
  .modal .field .code{margin-left:auto;font-size:10.5px;letter-spacing:.12em;color:#141414;border-left:1px solid #e4e1d8;padding-left:12px}
  .page.b .modal .field .code{color:var(--brand)}
  .modal .primary{
    margin-top:22px;width:100%;height:46px;border:0;cursor:pointer;
    background:#141414;color:#f8f7f3;font:600 12px/1 "Segoe UI";letter-spacing:.2em;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .page.a .modal .primary{border-radius:var(--r-a-sm)}
  .page.b .modal .primary{background:var(--brand);border-radius:var(--r-b-sm);box-shadow:0 12px 26px -14px rgba(39,67,240,.75)}
  .modal .or{display:flex;align-items:center;gap:14px;margin-top:22px;color:#b3aea4;font-size:10px;letter-spacing:.2em}
  .modal .or::before,.modal .or::after{content:"";flex:1;height:1px;background:#ece9e2}
  .modal .oauth{display:flex;gap:10px;margin-top:16px}
  .modal .oauth div{
    flex:1;height:40px;border:1px solid #e4e1d8;display:grid;place-items:center;
    font-size:12px;letter-spacing:.08em;color:#5d5952;cursor:pointer;
  }
  .page.a .modal .oauth div{border-radius:var(--r-a-sm)}
  .page.b .modal .oauth div{border-radius:var(--r-b-sm);border-color:#e2e5ee}
  .modal .fine{margin:18px 0 0;font-size:10.5px;line-height:1.7;color:#b3aea4;letter-spacing:.02em;text-align:center}

  /* ---------- 规范附录 ---------- */
  .spec{
    width:1440px;zoom:var(--s);display:grid;grid-template-columns:1fr 1fr;gap:34px;
    padding:26px 0 0;border-top:1px solid #232529;
    font:400 11px/1.75 "Segoe UI";color:#8b9199;
  }
  .spec h4{margin:0 0 14px;font:600 11px/1 "Segoe UI";letter-spacing:.2em;text-transform:uppercase;color:#e8e8e4}
  .spec .chips{display:flex;gap:7px;margin-bottom:16px}
  .spec .ch{width:62px;height:36px;border-radius:2px;display:flex;align-items:flex-end;padding:4px 5px;font:400 8px/1 Consolas,monospace;letter-spacing:.02em}
  .spec dl{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;margin:0}
  .spec dt{color:#7d838b;letter-spacing:.1em}   /* 原 #5f656d，3.3:1 → 5.1:1 */
  .spec dd{margin:0;color:#c9ced4}

  /* ---------- 动效降级 ---------- */
  /* 系统开启「减少动态效果」时，所有过渡/动画瞬时完成（含开场动画） */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>
<body>
<header class="topbar-ui">
  <div class="tb-title">AI Job Hunter</div>
  <div class="tb-sub">高保真关键帧 · 1440 × 900 · 两套风格 × 3 个状态</div>
  <nav class="tb-tabs" id="tabs"></nav>
</header>
<main id="stage"></main>

<script>
(function(){
  "use strict";

  /* ---------- 图形（线稿，两套共用几何、不同笔触） ---------- */
  function sceneA(kind){
    var S = 'stroke="#1b1b1b"';
    if(kind==='resume') return ''+
      '<svg viewBox="0 0 300 124" fill="none" xmlns="http://www.w3.org/2000/svg">'+
        '<path d="M18 62h34M56 62h-8" stroke="#1b1b1b" stroke-opacity=".16" stroke-dasharray="1 5"/>'+
        '<path d="M282 62h-34M244 62h8" stroke="#1b1b1b" stroke-opacity=".16" stroke-dasharray="1 5"/>'+
        '<rect x="101" y="6" width="98" height="112" rx="2" '+S+' stroke-opacity=".26"/>'+
        '<rect x="115" y="20" width="26" height="26" rx="1" '+S+' stroke-opacity=".42"/>'+
        '<path d="M151 24h34M151 32h24M151 40h30" '+S+' stroke-opacity=".2"/>'+
        '<path d="M115 60h70M115 72h56M115 84h64M115 96h34" '+S+' stroke-opacity=".24"/>'+
        '<circle cx="212" cy="96" r="10" '+S+' stroke-opacity=".5"/>'+
        '<path d="M207.5 96.2l3.2 3.4 6-7" '+S+' stroke-opacity=".85"/>'+
      '</svg>';
    if(kind==='jobs') return ''+
      '<svg viewBox="0 0 300 124" fill="none" xmlns="http://www.w3.org/2000/svg">'+
        '<path d="M30 88h240" stroke="#1b1b1b" stroke-opacity=".2" stroke-dasharray="1 6"/>'+
        '<circle cx="78" cy="88" r="4.5" '+S+' stroke-opacity=".3"/>'+
        '<circle cx="150" cy="88" r="5" fill="#1b1b1b" fill-opacity=".82"/>'+
        '<circle cx="222" cy="88" r="4.5" '+S+' stroke-opacity=".3"/>'+
        '<path d="M150 76V56" '+S+' stroke-opacity=".3"/>'+
        '<rect x="112" y="20" width="76" height="34" rx="2" '+S+' stroke-opacity=".45"/>'+
        '<path d="M124 32h34M124 41h50" '+S+' stroke-opacity=".22"/>'+
        '<rect x="186" y="26" width="4" height="22" fill="#1b1b1b" fill-opacity=".7"/>'+
        '<path d="M78 78V64M222 78V70" '+S+' stroke-opacity=".18" stroke-dasharray="1 5"/>'+
      '</svg>';
    return ''+
      '<svg viewBox="0 0 300 124" fill="none" xmlns="http://www.w3.org/2000/svg">'+
        '<rect x="46" y="30" width="108" height="54" rx="3" '+S+' stroke-opacity=".4"/>'+
        '<path d="M62 48h44M62 58h64M62 68h32" '+S+' stroke-opacity=".22"/>'+
        '<path d="M108 84l-6 14 20-14" '+S+' stroke-opacity=".4"/>'+
        '<rect x="160" y="58" width="80" height="44" rx="3" '+S+' stroke-opacity=".26"/>'+
        '<path d="M174 74h40M174 84h52" '+S+' stroke-opacity=".18"/>'+
        '<path d="M252 56a34 34 0 0 1 0 48" '+S+' stroke-opacity=".3"/>'+
        '<path d="M264 44a52 52 0 0 1 0 72" '+S+' stroke-opacity=".16"/>'+
      '</svg>';
  }

  function sceneB(kind){
    var BLUE = '#2743f0';
    if(kind==='resume') return ''+
      '<svg viewBox="0 0 300 124" fill="none" xmlns="http://www.w3.org/2000/svg">'+
        '<rect x="100" y="4" width="100" height="116" rx="8" stroke="#0e1116" stroke-opacity=".14"/>'+
        '<rect x="114" y="18" width="40" height="5" rx="2.5" fill="'+BLUE+'"/>'+
        '<rect x="114" y="31" width="58" height="4" rx="2" fill="#0e1116" opacity=".12"/>'+
        '<rect x="114" y="41" width="46" height="4" rx="2" fill="#0e1116" opacity=".1"/>'+
        '<rect x="114" y="58" width="72" height="4" rx="2" fill="#0e1116" opacity=".1"/>'+
        '<rect x="114" y="68" width="60" height="4" rx="2" fill="#0e1116" opacity=".1"/>'+
        '<rect x="114" y="92" width="70" height="7" rx="3.5" fill="#e7eaff"/>'+
        '<rect x="114" y="92" width="47" height="7" rx="3.5" fill="'+BLUE+'"/>'+
        '<circle cx="216" cy="34" r="11" fill="'+BLUE+'"/>'+
        '<path d="M211.4 34.4l3.1 3.2 6-7" stroke="#fff" stroke-width="1.6"/>'+
      '</svg>';
    if(kind==='jobs') return ''+
      '<svg viewBox="0 0 300 124" fill="none" xmlns="http://www.w3.org/2000/svg">'+
        '<path d="M28 92C86 92 96 34 150 34s66 52 124 52" stroke="'+BLUE+'" stroke-opacity=".26" stroke-dasharray="3 6"/>'+
        '<circle cx="28" cy="92" r="4" fill="#fff" stroke="'+BLUE+'" stroke-opacity=".4"/>'+
        '<circle cx="150" cy="34" r="6" fill="'+BLUE+'"/>'+
        '<circle cx="150" cy="34" r="12" stroke="'+BLUE+'" stroke-opacity=".22"/>'+
        '<circle cx="272" cy="86" r="4" fill="#fff" stroke="'+BLUE+'" stroke-opacity=".4"/>'+
        '<path d="M150 46v34" stroke="'+BLUE+'" stroke-opacity=".3"/>'+
        '<rect x="112" y="80" width="76" height="30" rx="7" fill="#f4f6ff" stroke="'+BLUE+'" stroke-opacity=".26"/>'+
        '<path d="M124 92h30M124 100h48" stroke="#0e1116" stroke-opacity=".16"/>'+
        '<rect x="176" y="90" width="4" height="10" rx="2" fill="'+BLUE+'" opacity=".7"/>'+
        '<rect x="186" y="86" width="4" height="14" rx="2" fill="'+BLUE+'" opacity=".35"/>'+
      '</svg>';
    return ''+
      '<svg viewBox="0 0 300 124" fill="none" xmlns="http://www.w3.org/2000/svg">'+
        '<rect x="44" y="26" width="112" height="58" rx="12" fill="#f4f6ff" stroke="'+BLUE+'" stroke-opacity=".26"/>'+
        '<path d="M62 46h48M62 58h66M62 70h30" stroke="#0e1116" stroke-opacity=".14"/>'+
        '<path d="M70 84l-8 16 22-16" fill="#f4f6ff" stroke="'+BLUE+'" stroke-opacity=".26"/>'+
        '<rect x="178" y="24" width="6" height="22" rx="3" fill="'+BLUE+'" opacity=".5"/>'+
        '<rect x="190" y="14" width="6" height="42" rx="3" fill="'+BLUE+'"/>'+
        '<rect x="202" y="30" width="6" height="12" rx="3" fill="'+BLUE+'" opacity=".35"/>'+
        '<rect x="214" y="8" width="6" height="54" rx="3" fill="'+BLUE+'" opacity=".7"/>'+
        '<rect x="226" y="34" width="6" height="10" rx="3" fill="'+BLUE+'" opacity=".3"/>'+
        '<circle cx="248" cy="34" r="15" stroke="'+BLUE+'" stroke-opacity=".3"/>'+
        '<path d="M248 26v10M244 40h8" stroke="'+BLUE+'" stroke-opacity=".6"/>'+
      '</svg>';
  }

  /* ---------- 弹窗 ---------- */
  function modal(){
    return ''+
    '<div class="scrim"><div class="modal">'+
      '<button class="x" aria-label="关闭"><svg width="13" height="13" viewBox="0 0 13 13" fill="none">'+
        '<path d="M1 1l11 11M12 1L1 12" stroke="currentColor" stroke-width="1.2"/></svg></button>'+
      '<div class="eyebrow">Account</div>'+
      '<h2>登录 Job Hunter</h2>'+
      '<p class="sub">登录后可上传简历与项目资料，建立你的求职档案。</p>'+
      '<div class="tabs"><span class="on">登录</span><span>注册</span></div>'+
      '<label>手机号 / 邮箱</label>'+
      '<div class="field"><span class="ph">you@example.com</span></div>'+
      '<div class="field"><span class="ph">6 位数字验证码</span><span class="code">获取验证码</span></div>'+
      '<button class="primary">进入 Job Hunter<svg width="14" height="10" viewBox="0 0 14 10" fill="none">'+
        '<path d="M0 5h12M8.5 1L12.5 5l-4 4" stroke="currentColor" stroke-width="1.2"/></svg></button>'+
      '<div class="or">或</div>'+
      '<div class="oauth"><div>微信登录</div><div>GitHub 登录</div></div>'+
      '<p class="fine">继续即表示同意《服务条款》与《隐私政策》</p>'+
    '</div></div>';
  }

  /* ---------- 单帧 ---------- */
  function frame(style, state){
    var A = style === 'a';
    var guest = state === 'guest';
    var done  = state !== 'guest';
    var label = guest ? '登录后上传你的求职资料'
              : '上传资料，建立你的求职档案';
    var avatar = guest
      ? '<div class="avatar" title="登录 / 注册"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15">'+
        '<circle cx="12" cy="8.6" r="3.5"/><path d="M5.2 19.6c1.5-3.6 3.9-5.2 6.8-5.2s5.3 1.6 6.8 5.2"/></svg></div>'
      : '<div class="avatar logged" title="账户信息"><span class="ini">SJ</span></div>';

    var tooltip = (done && state !== 'modal') ? '<span class="tip">查看或更新资料</span>' : '';

    var cards = [
      ['01','Resume','简历','解析、诊断并重写简历，把真实经历整理成有证据的表达。'],
      ['02','Jobs','岗位','搜索并核验岗位，说明匹配依据与能力差距。'],
      ['03','Interview','面试','结合简历与岗位 JD 进行多轮模拟面试，给到具体反馈。']
    ].map(function(c,i){
      var kind = ['resume','jobs','interview'][i];
      var hv = (state === 'hover' && i === 1) ? ' is-hover' : '';
      return ''+
      '<article class="card'+hv+'">'+
        '<div class="c-top"><span class="num">'+c[0]+'</span><span class="en">'+c[1]+'</span></div>'+
        '<div class="scene">'+(A?sceneA(kind):sceneB(kind))+'</div>'+
        '<h3>'+c[2]+'</h3>'+
        '<p>'+c[3]+'</p>'+
        '<span class="go">进入<svg width="17" height="8" viewBox="0 0 17 8" fill="none">'+
          '<path d="M0 4h15M11.6 .4L15.4 4l-3.8 3.6" stroke="currentColor" stroke-width="1"/></svg></span>'+
      '</article>';
    }).join('');

    var bgpaths = A ? '' :
      '<svg class="bgpaths" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'+
        '<path d="M-60 664C240 610 372 250 704 240c330-10 402 300 800 246" stroke="#dce3ff" stroke-width="1.3"/>'+
        '<path d="M-60 736C300 700 424 330 726 320c308-10 396 292 780 250" stroke="#eaeeff" stroke-width="1.3" stroke-dasharray="3 8"/>'+
        '<circle cx="704" cy="240" r="3" fill="#2743f0" opacity=".45"/>'+
        '<circle cx="726" cy="320" r="3" fill="#2743f0" opacity=".22"/>'+
        '<circle cx="292" cy="452" r="2" fill="#2743f0" opacity=".18"/>'+
      '</svg>';

    return ''+
    '<div class="page '+style+'">'+
      bgpaths+
      '<div class="rail">'+
        '<div class="mark"><i></i><span>AI Job Hunter</span></div>'+
        '<div class="upload '+(done?'done':'')+'">'+
          '<span class="arw"><svg width="17" height="26" viewBox="0 0 17 26" fill="none">'+
            '<path d="M8.5 24.5V3.4" stroke="currentColor" stroke-width="1.25"/>'+
            '<path d="M3.2 8.6L8.5 3.3l5.3 5.3" stroke="currentColor" stroke-width="1.25"/></svg></span>'+
          (done?'':'<span class="lbl">'+label+'</span>')+
          tooltip+
        '</div>'+
        avatar+
      '</div>'+
      '<div class="hero">'+
        '<h1>Welcome to Job Hunter'+(A?'':'<em>.</em>')+'</h1>'+
        '<p class="tag">Hunt job, hunt your heart</p>'+
      '</div>'+
      '<div class="cards">'+cards+'</div>'+
      '<div class="foot"><span>AI-Job-Hunter <span class="dot">/</span> 求职决策与执行平台</span><span>让每一次投递都有依据</span></div>'+
      (state==='modal' ? modal() : '')+
    '</div>';
  }

  /* ---------- 帧清单 ---------- */
  var FRAMES = [
    {id:'A1', style:'a', state:'guest',  cap:'首次进入：未登录、未上传'},
    {id:'A2', style:'a', state:'hover',  cap:'已登录已上传：仅剩箭头，卡片轻微悬停'},
    {id:'A3', style:'a', state:'modal',  cap:'点击头像：中央弹窗，主页压暗保留'},
    {id:'B1', style:'b', state:'guest',  cap:'首次进入：未登录、未上传'},
    {id:'B2', style:'b', state:'hover',  cap:'已登录已上传：仅剩箭头，卡片明显上浮'},
    {id:'B3', style:'b', state:'modal',  cap:'点击头像：中央弹窗，主页压暗保留'}
  ];

  var params  = new URLSearchParams(location.search);
  var shotId  = params.get('shot');
  var stage   = document.getElementById('stage');
  var tabs    = document.getElementById('tabs');
  var list    = shotId ? FRAMES.filter(function(f){ return f.id === shotId; }) : FRAMES;

  stage.innerHTML = list.map(function(f){
    return '<div class="shotwrap" data-id="'+f.id+'">'+
      '<div class="frame">'+frame(f.style, f.state)+'</div>'+
      '<div class="cap"><b>'+f.id+'</b> &nbsp; '+f.cap+'</div>'+
    '</div>';
  }).join('');

  if(shotId){
    document.body.classList.add('shot');
    stage.style.setProperty('--s', 1);
    return;
  }

  function chip(hex,label,dark){
    return '<div class="ch" style="background:'+hex+';color:'+(dark?'#fff':'#111')+'">'+label+'</div>';
  }

  stage.insertAdjacentHTML('beforeend',
    '<div class="spec">'+
      '<div>'+
        '<h4>A · 黑白灰 / 点阵 / 衬线标题</h4>'+
        '<div class="chips">'+chip('#f6f5f1','#F6F5F1')+chip('#121212','#121212',1)+
          chip('#5d5952','#5D5952',1)+chip('#726d63','#726D63')+chip('#e4e1d8','#E4E1D8')+'</div>'+
        '<dl>'+
          '<dt>标题</dt><dd>Georgia 61px / 行高 1.12 / 字距 -1.8%</dd>'+
          '<dt>正文</dt><dd>12.5px / 行高 1.78 / 字距 0.02em</dd>'+
          '<dt>小标签</dt><dd>10.5px 大写 / 字距 0.44em</dd>'+
          '<dt>卡片</dt><dd>312 × 322 / 圆角 3 / 描边 1px / 间距 26</dd>'+
          '<dt>悬停</dt><dd>上移 5px + 描边转黑 + 投影 0 22 44 -32</dd>'+
          '<dt>节奏</dt><dd>上留白 106 → 标题 → 62 → 卡片</dd>'+
        '</dl>'+
      '</div>'+
      '<div>'+
        '<h4>B · 黑白蓝 / 路径 / 无衬线标题</h4>'+
        '<div class="chips">'+chip('#ffffff','#FFFFFF')+chip('#0e1116','#0E1116',1)+
          chip('#2743f0','#2743F0',1)+chip('#6e7587','#6E7587')+chip('#e6e8f0','#E6E8F0')+'</div>'+
        '<dl>'+
          '<dt>标题</dt><dd>Segoe UI 58px / 600 / 字距 -3.2%</dd>'+
          '<dt>正文</dt><dd>12.5px / 行高 1.78 / 字距 0.02em</dd>'+
          '<dt>小标签</dt><dd>10.5px 大写 / 字距 0.34em</dd>'+
          '<dt>卡片</dt><dd>312 × 322 / 圆角 16 / 描边 1px / 间距 26</dd>'+
          '<dt>悬停</dt><dd>上移 11px + 顶部蓝条展开 + 投影 0 34 60 -30</dd>'+
          '<dt>节奏</dt><dd>上留白 106 → 标题 → 62 → 卡片</dd>'+
        '</dl>'+
      '</div>'+
    '</div>');

  tabs.innerHTML = FRAMES.map(function(f,i){
    return '<button data-i="'+i+'">'+f.id+'</button>';
  }).join('');
  var btns = Array.prototype.slice.call(tabs.querySelectorAll('button'));
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      var el = stage.querySelector('[data-id="'+FRAMES[+b.dataset.i].id+'"]');
      el.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });

  function fit(){
    var s = Math.min((window.innerWidth - 96) / 1440, (window.innerHeight - 150) / 900, 1);
    stage.style.setProperty('--s', Math.max(0.28, s));
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
